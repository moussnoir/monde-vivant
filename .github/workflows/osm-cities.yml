name: Générer des plans OpenStreetMap

# Lancement manuel : Actions > « Générer des plans OpenStreetMap » > Run workflow
on:
  schedule:
    - cron: '17 2 * * *'   # chaque nuit : 1re fois mise à jour des plans existants, puis les plus grandes villes manquantes
  workflow_dispatch:
    inputs:
      cities:
        description: 'Villes « Nom:ISO » séparées par des espaces (ex. Porto-Novo:BJ Parakou:BJ)'
        required: false
        default: ''
      country:
        description: 'Ou toutes les villes d’un pays (code ISO, ex. BJ)'
        required: false
        default: ''
      top:
        description: 'Ou les N plus grandes villes pas encore générées'
        required: false
        default: ''
      refresh:
        description: 'Régénérer les plans existants (commerces, noms)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Générer
        env:
          CITIES: ${{ github.event.inputs.cities }}
          COUNTRY: ${{ github.event.inputs.country }}
          TOP: ${{ github.event.inputs.top }}
          REFRESH: ${{ github.event.inputs.refresh }}
          EVENT: ${{ github.event_name }}
        run: |
          set -f
          ARGS=(--max-minutes 320 --max-total-mb 700)
          if [ "$EVENT" = "schedule" ]; then
            if [ ! -f models/osm/.v2 ]; then ARGS+=(--refresh); touch models/osm/.v2; else ARGS+=(--top 400); fi
          fi
          [ "$REFRESH" = "true" ] && ARGS+=(--refresh)
          for c in $CITIES; do ARGS+=("$c"); done
          [ -n "$COUNTRY" ] && ARGS+=(--country "$COUNTRY")
          [ -n "$TOP" ] && ARGS+=(--top "$TOP")
          node tools/osm-build.mjs "${ARGS[@]}"
      - name: Committer les nouveaux plans
        if: always()
        env:
          LABEL: ${{ github.event.inputs.cities }}${{ github.event.inputs.country }}${{ github.event.inputs.top }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/osm
          git diff --cached --quiet && echo "Aucun nouveau plan" && exit 0
          git commit -m "Plans OSM : ${LABEL:-mise à jour automatique}"
          git pull --rebase -q && git push
